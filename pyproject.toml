[project]
name = "griptape_nodes_library_scikit_image"
version = "0.1.0"
description = "Griptape Nodes library that splits an image into its separate pieces with scikit-image"
authors = [{ name = "Jason Schleifer", email = "jason.schleifer@gmail.com" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["numpy>=2.2,<3", "scipy>=1.13,<2", "scikit-image>=0.25,<1", "pillow>=11"]

[tool.uv.sources]
griptape-nodes-engine = { git = "https://github.com/griptape-ai/griptape-nodes-engine", rev = "v0.107.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["griptape_nodes_library_scikit_image"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest", "griptape-nodes-engine>=0.107.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv-dev"
include = ["."]
exclude = [".venv", ".venv-dev", ".venv-exec", "**/node_modules", "**/__pycache__", "**/.*", "templates"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
